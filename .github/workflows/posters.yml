name: Update Movie Posters

on:

  workflow_dispatch:

  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"

  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/posters.yml"

permissions:
  contents: write

concurrency:
  group: bfilmy-movie-posters
  cancel-in-progress: true

jobs:

  posters:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # RUN PIPELINE
      # ======================================================

      - name: Download and generate posters
        run: |
          python main.py

      # ======================================================
      # VERIFY
      # ======================================================

      - name: Verify poster files
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "VERIFYING POSTER FILES"
          echo "======================================"

          COUNT=0
          FAILED=0

          while IFS= read -r -d '' FILE
          do

            SIZE=$(stat -c%s "$FILE")

            if [ "$SIZE" -gt 20480 ]
            then

              echo "ERROR:"
              echo "$FILE = $SIZE bytes"

              FAILED=1

            fi

            if [ "$SIZE" -le 0 ]
            then

              echo "ERROR:"
              echo "$FILE is empty"

              FAILED=1

            fi

            COUNT=$((COUNT + 1))

          done < <(
            find images \
              -type f \
              -name "*.jpg" \
              -print0
          )

          echo ""
          echo "Verified posters: $COUNT"

          if [ "$FAILED" -ne 0 ]
          then
            echo ""
            echo "Poster validation failed."
            exit 1
          fi

          echo ""
          echo "All posters are <= 20 KB."

      # ======================================================
      # SHOW GIT STATUS
      # ======================================================

      - name: Show Git status
        run: |
          echo "======================================"
          echo "GIT STATUS"
          echo "======================================"

          git status --short

      # ======================================================
      # STAGE EVERYTHING
      #
      # IMPORTANT:
      #
      # git diff does not see untracked files.
      # git add does.
      # ======================================================

      - name: Stage poster changes
        run: |

          git add images/
          git add poster-manifest.json

      # ======================================================
      # CHECK STAGED CHANGES
      # ======================================================

      - name: Check staged changes
        id: changes
        shell: bash
        run: |

          if git diff --cached --quiet
          then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No staged changes."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Changes detected."

            echo ""
            echo "Staged files:"
            git diff --cached --stat

          fi

      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit poster updates
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "chore: update movie posters"

      # ======================================================
      # PUSH
      # ======================================================

      - name: Push poster updates
        if: steps.changes.outputs.changed == 'true'
        run: |

          git push

      # ======================================================
      # NO CHANGES
      # ======================================================

      - name: Nothing to push
        if: steps.changes.outputs.changed == 'false'
        run: |

          echo "No changes to push."
