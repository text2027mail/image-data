name: Update Movie Posters

on:

  # Manual run
  workflow_dispatch:

  # Every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Automatically test when downloader changes
  push:
    paths:
      - "main.py"
      - ".github/workflows/posters.yml"

permissions:
  contents: write

concurrency:
  group: bfilmy-movie-posters
  cancel-in-progress: true

jobs:

  posters:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      # ======================================================
      # RUN
      # ======================================================

      - name: Download and optimize posters
        run: |
          python main.py

      # ======================================================
      # VERIFY
      # ======================================================

      - name: Verify poster files
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "VERIFYING POSTER FILES"
          echo "======================================"

          COUNT=0

          while IFS= read -r -d '' FILE
          do

            SIZE=$(stat -c%s "$FILE")

            if [ "$SIZE" -gt 20480 ]
            then

              echo "ERROR:"
              echo "$FILE = $SIZE bytes"

              exit 1

            fi

            if [ "$SIZE" -le 0 ]
            then

              echo "ERROR:"
              echo "$FILE is empty"

              exit 1

            fi

            COUNT=$((COUNT + 1))

          done < <(
            find images \
              -type f \
              -name "*.jpg" \
              -print0
          )

          echo ""
          echo "Verified posters: $COUNT"
          echo "All posters <= 20 KB."

      # ======================================================
      # CHECK GIT CHANGES
      # ======================================================

      - name: Check for changes
        id: changes
        shell: bash
        run: |

          if git diff \
            --quiet \
            -- images poster-manifest.json
          then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit poster updates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            images/ \
            poster-manifest.json

          git commit \
            -m "chore: update movie posters"

          git push

      # ======================================================
      # NO CHANGES
      # ======================================================

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No poster changes."
          echo "Nothing to commit."
