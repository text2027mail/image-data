name: Update Movie Posters

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movie-posters
  cancel-in-progress: true

jobs:

  posters:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Update posters
        run: |
          python main.py

      - name: Verify 20 KB limit
        shell: bash
        run: |
          set -e

          find images -type f -name "*.jpg" -print0 |
          while IFS= read -r -d '' file; do

            size=$(stat -c%s "$file")

            if [ "$size" -gt 20480 ]; then
              echo "ERROR: $file = $size bytes"
              exit 1
            fi

          done

          echo "All posters are <= 20 KB."

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/ poster-manifest.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update movie posters"
          git push
